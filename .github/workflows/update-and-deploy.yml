name: Update data & deploy to Pages

on:
  schedule:
    - cron: "17 11 * * 1-5" # Morning daily-price recovery
    - cron: "30 10 * * 1-5" # 10:30AM Eastern price snapshot
      timezone: America/New_York
    - cron: "0 13,16 * * 1-5" # 1PM and 4PM Eastern price snapshots
      timezone: America/New_York
    - cron: "47 21 * * 1-5" # Completed-session signals and scanner
    - cron: "17 23 * * 1-5" # Recovery, without broad scanner
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh market data before deployment
        type: boolean
        default: true
      mode:
        description: Refresh type
        type: choice
        options: [recovery, full, quotes]
        default: recovery
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# Do not interrupt a collector before its cache is saved.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        id: market-cache
        with:
          path: .cache
          key: market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-v1-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test data failure handling
        run: |
          python -m unittest discover -s tests -v
          node tests/test_data_quality.cjs
      - name: Restore, refresh if requested, and stage site
        env:
          REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
          PYTHONUNBUFFERED: "1"
          YAHOO_DAILY_OPERATIONS: "5000"
          YAHOO_MIN_INTERVAL: "1.0"
          SCAN_MAX_SYMBOLS: "750"
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            MODE="${MANUAL_MODE:-full}"
            case "$SCHEDULE" in
              "30 10 * * 1-5"|"0 13,16 * * 1-5") MODE=quotes ;;
              "17 11 * * 1-5"|"17 23 * * 1-5") MODE=recovery ;;
            esac
            python scripts/publish_data.py --refresh --mode "$MODE"
          else
            python scripts/publish_data.py
          fi
      - name: Save acquisition progress even when collection fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: market-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-health
          path: data/health-*.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
